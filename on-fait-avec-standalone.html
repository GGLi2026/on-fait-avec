Vous riez toutes les deux — ce rire épuisé qui n'est pas vraiment drôle.

*« Y'a une AG jeudi »*, dit Fatou.`,question:"Est-ce que tu vas à l'AG ?",choix:[{label:"Non. T'as les enfants jeudi soir.",vers:"complY-a"},{label:"Tu demandes à quelqu'un de garder les enfants.",vers:"complY-b"},{label:"Tu envoies un message à Fatou : « Je viens. On y va ensemble ? »",vers:"complY-c"}]},"complY-a":{completion:!0,phrase:`Yasmine rentre chez elle. La journée est finie.

Elle a géré — comme hier. Mais ce soir, quelque chose a été dit dans ce vestiaire qui n'existait pas avant.`,versRessources:"fin-ya"},"complY-b":{completion:!0,phrase:`Ça t'a pris dix minutes à organiser.

Yasmine ne savait pas que c'était possible.`,versRessources:"fin-yb"},"complY-c":{completion:!0,phrase:`Fatou répond en 30 secondes : *« Enfin. »*

Yasmine n'est pas encore militante.
Elle va juste à une assemblée avec une collègue.
C'est souvent comme ça que ça commence.`,versRessources:"fin-yc"},"fin-ya":{ressources:!0,texteNommer:"Yasmine rentre chez elle. La journée est finie. Elle a géré — comme hier, comme demain probablement. Ce n'est pas de la force — c'est de l'adaptation. La nuance est importante.",faitReel:"Des centaines d'animateurs·trices du parascolaire genevois ont fait grève pour qu'il y ait toujours deux animateurs·trices par groupe. Pour que Matteo ait un·e accompagnant·e. Pour que Luca puisse être changé sans que 27 autres enfants soient laissés seuls.",question:"Y a-t-il quelqu'un dans ton équipe à qui tu n'as jamais dit que tu avais peur qu'il arrive quelque chose ?",versN2:"nv2-1"},"fin-yb":{ressources:!0,texteNommer:"Ça t'a pris dix minutes à organiser. Tu ne savais pas que c'était possible. Yasmine n'est pas encore militante. Elle va juste à une assemblée. C'est souvent comme ça que ça commence.",faitReel:"Des centaines d'animateurs·trices ont fait grève — puis recommencé. L'une de leurs revendications : deux animateurs·trices minimum par groupe, toujours.",question:"Est-ce qu'il y a quelqu'un dans ton équipe à qui tu pourrais dire — juste dire — ce que tu as ressenti à 12h17 aujourd'hui ?",versN2:"nv2-1"},"fin-yc":{ressources:!0,texteNommer:"Fatou répond en 30 secondes : « Enfin. » Dans ce mot il y a tout — le soulagement que quelqu'un ait fait le pas, la fatigue d'avoir attendu, l'envie que ça change.",faitReel:"Ces personnes ne sont pas des militant·es professionnel·les. Ce sont des Yasmine et des Fatou qui ont décidé d'aller à l'AG plutôt que de rentrer chez elles. Le syndicat, c'est ça — pas une institution au-dessus, mais des collègues qui décident ensemble.",question:"Y a-t-il quelqu'un dans ton équipe à qui tu pourrais écrire « je viens — on y va ensemble ? »",versN2:"nv2-1"},"nv2-1":{niveau:2,contexte:"Le lendemain — Salle de pause, même école",sousTitre:"Deux collègues, deux blocages",texte:["Le lendemain matin. Yasmine a parlé à deux collègues de l'AG. Elles ont réagi différemment.","**Diane** : *« J'ai déjà essayé de me mobiliser il y a deux ans. Ça n'a rien changé. Je me bats plus contre des moulins à vent. »*","**Priya** : *« J'aimerais bien, mais j'ai peur. Mon contrat se termine en juin. »*","Deux personnes. Deux blocages très différents. Tu ne peux pas répondre la même chose aux deux."],question:"Par qui tu commences ?",choix:[{label:"Tu parles d'abord à Diane — le découragement, tu connais.",vers:"nv2-diane"},{label:"Tu parles d'abord à Priya — la peur des représailles, c'est concret.",vers:"nv2-priya"}]},"nv2-diane":{niveau:2,contexte:"Conversation avec Diane",sousTitre:"Le découragement",texte:["Diane range sa veste. Elle n'a pas l'air hostile — elle a l'air fatiguée de façon différente de la fatigue ordinaire. La fatigue de quelqu'un qui a essayé."],question:"Qu'est-ce que tu lui dis ?",choix:[{label:"« Je comprends. Mais là c'est différent — on est plus nombreuses qu'avant. »",vers:"nv2-diane-a"},{label:"« C'était quoi, il y a deux ans ? Qu'est-ce qui s'est passé ? »",vers:"nv2-diane-b"},{label:"« T'as pas à faire grand-chose. Juste signer. Juste être comptée. »",vers:"nv2-diane-c"}]},"nv2-diane-a":{niveau:2,reaction:`Diane te regarde. *« C'est ce qu'on disait la dernière fois aussi. »*

Pas faux. Tu n'as pas d'argument contre ça. Et argumenter contre le découragement de quelqu'un qui a déjà essayé, c'est rarement efficace.

Elle prend son téléphone et sort. La conversation est finie — pour l'instant.`,texte:["Tu n'as pas convaincu Diane. Mais tu as essayé. Et elle sait maintenant que tu es là, que tu y crois.","*Parfois c'est suffisant pour que quelqu'un revienne.*"],choix:[{label:"Tu vas parler à Priya →",vers:"nv2-priya"}]},"nv2-diane-b":{niveau:2,reaction:`Diane s'arrête. Personne ne lui avait posé cette question-là.

Elle te raconte. Une pétition, il y a deux ans. Beaucoup de bruit au début. Puis la direction avait convoqué la responsable, qui était revenue en disant que c'était « pas le bon moment ».

*« Le bon moment, ça vient jamais. »*`,texte:["Tu écoutes. Tu ne cherches pas à la convaincre tout de suite.","*« Ce qui était différent cette fois, »* tu dis doucement, *« c'est qu'on avait pas demandé la permission. On a juste fait la grève. »*","Diane reste silencieuse. *« Je viendrai pas à l'AG. Mais si vous faites quelque chose le matin avant le service, je suis là. »*"],choix:[{label:"Tu vas parler à Priya →",vers:"nv2-priya"}]},"nv2-diane-c":{niveau:2,reaction:`Diane lève les yeux. *« Juste être comptée. »* Elle répète la phrase comme si elle en vérifiait le poids.

*« C'est tout ce que tu me demandes ? »*

*« C'est tout. »*

Elle réfléchit. *« OK. Envoie-moi l'heure. »*`,texte:["Tu n'as pas changé ses convictions. Mais tu lui as proposé quelque chose de petit — assez petit pour ne pas faire peur, assez concret pour exister.","*C'est souvent comme ça que ça marche.*"],choix:[{label:"Tu vas parler à Priya →",vers:"nv2-priya"}]},"nv2-priya":{niveau:2,contexte:"Conversation avec Priya",sousTitre:"La peur des représailles",texte:["Priya range ses affaires lentement. Elle n'évite pas ton regard — elle a juste l'air de quelqu'un qui pèse chaque mot avant de parler.","*« J'aimerais. Vraiment. Mais mon contrat... tu sais comment c'est. »*"],question:"Qu'est-ce que tu lui réponds ?",choix:[{label:"« Je comprends. Je voulais juste que tu saches que t'es pas seule. »",vers:"nv2-priya-a"},{label:"« En Suisse, licencier quelqu'un pour activité syndicale c'est illégal. »",vers:"nv2-priya-b"},{label:"« T'as pas besoin de signer quoi que ce soit. Viens juste écouter. »",vers:"nv2-priya-c"}]},"nv2-priya-a":{niveau:2,reaction:`Priya hoche la tête. Elle a l'air soulagée que tu ne l'aies pas poussée davantage.

*« Merci. »*

Ce n'est pas un oui. Mais ce n'est pas un non définitif non plus. Et tu viens de faire quelque chose d'important : lui dire qu'elle compte, quelle que soit sa décision.`,choix:[{label:"Suite →",vers:"nv2-fin"}]},"nv2-priya-b":{niveau:2,reaction:`Priya te regarde. *« Théoriquement. Mais prouve-le si ça arrive. »*

Elle n'a pas tort. La protection légale existe — et elle est faible en Suisse.

Tu essaies autrement. *« En tout cas, t'as pas besoin de signer quoi que ce soit. Viens juste écouter. »*

Elle réfléchit. *« Peut-être. »*`,choix:[{label:"Suite →",vers:"nv2-fin"}]},"nv2-priya-c":{niveau:2,reaction:`Priya réfléchit. *« Juste écouter. »*

*« Juste écouter. »*

*« OK. Mais si je pars avant la fin, tu dis rien. »*

*« Promis. »*`,texte:["Tu lui as proposé le minimum d'engagement possible. Pas parce que tu la sous-estimes — parce que tu respectes où elle en est."],choix:[{label:"Suite →",vers:"nv2-fin"}]},"nv2-fin":{niveau:2,sousTitre:"Une conversation à la fois",finN2:!0,texteNommer:`Yasmine n'a pas tout résolu. Elle n'a pas convaincu tout le monde. Elle a parlé à deux personnes, différemment, en partant de là où elles étaient.

C'est exactement ça, organiser. Pas convaincre en masse — parler à des individus, une conversation à la fois.`,faitReel:"Jane McAlevey appelle ça le « one-on-one » — la conversation individuelle comme base de toute mobilisation. On ne convainc pas les collègues en leur parlant comme à une foule. On les convainc en leur parlant comme à des personnes.",question:"Dans ton équipe, qui est la Diane et qui est la Priya ? Est-ce que tu leur as parlé différemment jusqu'ici ?",phrasePoint:"Ce que tu viens de jouer, c'est la base de toute mobilisation selon McAlevey : parler à des individus, pas à une foule."}},Op=`
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&display=swap');

  :root {
    --rouge: #D42B23;
    --rouge-sombre: #9E1F19;
    --bleu: #5BC0EB;
    --bleu-sombre: #2A8DB5;
    --bleu-pale: #EBF7FD;
    --noir: #111111;
    --gris-fonce: #2A2A2A;
    --gris: #5A5A5A;
    --gris-clair: #E8E8E8;
    --blanc: #FFFFFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Source Serif 4', Georgia, serif;
    background: var(--blanc);
    color: var(--noir);
    min-height: 100vh;
  }

  /* ÉCRANS */
  .ecran {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: var(--blanc);
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* BANDE TITRE */
  .bande {
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .bande-bleu { background: var(--bleu); border-top: 3px solid var(--rouge); }
  .bande-rouge { background: var(--rouge); }

  .bande-texte {
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.9);
    font-family: 'Source Serif 4', serif;
    font-weight: 300;
    flex: 1;
  }

  .bande-retour {
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.8);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
    flex-shrink: 0;
  }

  .bande-menu {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.85);
    font-family: 'Source Serif 4', serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 10px;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* CORPS */
  .corps {
    flex: 1;
    max-width: 620px;
    margin: 0 auto;
    width: 100%;
    padding: 44px 24px 80px;
  }

  .corps-titre {
    padding: 60px 28px 48px;
    max-width: 620px;
    margin: 0 auto;
    width: 100%;
  }

  /* TYPOGRAPHIE */
  .label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--bleu-sombre);
    margin-bottom: 20px;
    font-weight: 300;
  }

  .label-rouge { color: var(--rouge); }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(36px, 7vw, 64px);
    line-height: 1.1;
    color: var(--noir);
    margin-bottom: 8px;
  }

  h1 em { color: var(--bleu-sombre); font-style: italic; }

  .accroche {
    font-size: clamp(15px, 2.5vw, 18px);
    color: var(--gris);
    font-weight: 300;
    font-style: italic;
    margin-bottom: 36px;
    line-height: 1.5;
  }

  .intro-bloc {
    font-size: 15px;
    line-height: 1.8;
    color: var(--gris-fonce);
    font-weight: 300;
    margin-bottom: 40px;
    padding: 20px 24px;
    border: 1px solid var(--gris-clair);
    border-left: 3px solid var(--bleu);
  }

  /* BOUTONS ACCUEIL */
  .btns-accueil {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 28px;
  }

  .btn-primaire {
    background: var(--bleu);
    color: var(--blanc);
    font-family: 'Source Serif 4', serif;
    font-size: 15px;
    font-weight: 400;
    padding: 16px 28px;
    cursor: pointer;
    border: none;
    text-align: left;
    transition: background 0.2s, transform 0.15s;
    letter-spacing: 0.3px;
  }

  .btn-primaire:hover { background: var(--bleu-sombre); transform: translateX(4px); }

  .btn-sec-rouge {
    background: transparent;
    color: var(--rouge);
    border: 1.5px solid var(--rouge);
    font-family: 'Source Serif 4', serif;
    font-size: 14px;
    font-weight: 400;
    padding: 14px 28px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
  }

  .btn-sec-rouge:hover { background: var(--rouge); color: var(--blanc); }

  .btn-sec-bleu {
    background: transparent;
    color: var(--bleu-sombre);
    border: 1.5px solid var(--bleu);
    font-family: 'Source Serif 4', serif;
    font-size: 14px;
    font-weight: 400;
    padding: 14px 28px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
  }

  .btn-sec-bleu:hover { background: var(--bleu); color: var(--blanc); }

  .info-bas {
    font-size: 12px;
    color: var(--gris);
    letter-spacing: 0.5px;
    padding-top: 20px;
    border-top: 1px solid var(--gris-clair);
  }

  /* MENU SCÉNARIOS */
  .carte-scenario {
    background: var(--blanc);
    border: 1.5px solid var(--gris-clair);
    padding: 20px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    margin-bottom: 12px;
    text-align: left;
    width: 100%;
  }

  .carte-scenario:hover { border-color: var(--bleu); transform: translateX(4px); }

  .carte-numero {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--bleu-sombre);
    margin-bottom: 8px;
    font-family: 'Source Serif 4', serif;
  }

  .carte-nom {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--noir);
    margin-bottom: 6px;
  }

  .carte-accroche {
    font-size: 13px;
    color: var(--rouge);
    font-weight: 400;
    margin-bottom: 6px;
    font-style: italic;
  }

  .carte-tags {
    font-size: 12px;
    color: var(--gris);
    font-weight: 300;
  }

  .liens-bas {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-start;
  }

  .lien-texte {
    background: none;
    border: none;
    color: var(--rouge);
    font-family: 'Source Serif 4', serif;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 0;
  }

  .lien-texte-bleu { color: var(--bleu-sombre); }

  /* JEU */
  .contexte {
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--bleu-sombre);
    margin-bottom: 24px;
    font-weight: 300;
  }

  .contexte::before { content: '●'; color: var(--rouge); margin-right: 8px; font-size: 8px; vertical-align: middle; }

  .sous-titre {
    font-family: 'Playfair Display', serif;
    font-size: clamp(20px, 4vw, 28px);
    color: var(--noir);
    line-height: 1.3;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--rouge);
    display: inline-block;
  }

  .narratif {
    font-size: 16px;
    line-height: 1.85;
    color: var(--gris-fonce);
    font-weight: 300;
    margin-bottom: 14px;
  }

  .reaction {
    background: var(--blanc);
    border: 1px solid var(--gris-clair);
    border-left: 3px solid var(--rouge);
    padding: 20px 24px;
    margin: 28px 0;
    font-size: 15px;
    line-height: 1.8;
    color: var(--gris-fonce);
    font-weight: 300;
    white-space: pre-line;
  }

  .separateur {
    width: 36px;
    height: 2px;
    background: var(--rouge);
    margin: 36px 0;
  }

  .question {
    font-family: 'Playfair Display', serif;
    font-size: clamp(18px, 3vw, 24px);
    color: var(--noir);
    margin: 32px 0 20px;
    line-height: 1.4;
  }

  /* CHOIX */
  .choix-container { display: flex; flex-direction: column; gap: 10px; }

  .choix-btn {
    background: var(--blanc);
    border: 1.5px solid var(--gris-clair);
    color: var(--gris-fonce);
    font-family: 'Source Serif 4', serif;
    font-size: 15px;
    font-weight: 300;
    padding: 16px 20px 16px 48px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    line-height: 1.5;
    position: relative;
    width: 100%;
  }

  .choix-btn:hover { border-color: var(--bleu); background: #EBF7FD; color: var(--noir); transform: translateX(5px); }

  .choix-lettre {
    position: absolute;
    left: 16px;
    top: 16px;
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--rouge);
  }

  /* COMPLÉTION */
  .completion-bloc {
    text-align: center;
    padding: 60px 20px 40px;
  }

  .completion-ligne {
    width: 40px;
    height: 2px;
    background: var(--rouge);
    margin: 0 auto 32px;
  }

  .completion-titre {
    font-family: 'Playfair Display', serif;
    font-size: clamp(20px, 4vw, 28px);
    color: var(--noir);
    margin-bottom: 24px;
  }

  .completion-phrase {
    font-size: 15px;
    line-height: 1.8;
    color: var(--gris);
    font-style: italic;
    margin-bottom: 48px;
    white-space: pre-line;
  }

  .btn-completion {
    background: var(--rouge);
    color: var(--blanc);
    font-family: 'Source Serif 4', serif;
    font-size: 15px;
    padding: 16px 40px;
    cursor: pointer;
    border: none;
    transition: background 0.2s;
  }

  .btn-completion:hover { background: var(--rouge-sombre); }

  /* RESSOURCES */
  .bloc-nommer {
    font-size: 15px;
    line-height: 1.85;
    color: var(--gris-fonce);
    font-weight: 300;
    font-style: italic;
    margin-bottom: 28px;
    padding: 20px 24px;
    border-left: 3px solid var(--rouge);
    white-space: pre-line;
  }

  .bloc-reel {
    background: var(--bleu);
    padding: 24px;
    margin-bottom: 24px;
    color: var(--blanc);
  }

  .bloc-reel-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    margin-bottom: 12px;
  }

  .bloc-reel-texte { font-size: 14px; line-height: 1.75; font-weight: 300; }

  .bloc-question {
    background: var(--blanc);
    border: 1px solid var(--gris-clair);
    border-left: 3px solid var(--rouge);
    padding: 24px;
    margin-bottom: 24px;
  }

  .bloc-question-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--rouge);
    margin-bottom: 12px;
  }

  .bloc-question-texte {
    font-family: 'Playfair Display', serif;
    font-size: clamp(16px, 3vw, 20px);
    color: var(--noir);
    line-height: 1.5;
  }

  .bloc-pont {
    font-size: 13px;
    color: var(--gris);
    font-style: italic;
    line-height: 1.7;
    margin-bottom: 16px;
  }

  .btn-retour-menu {
    background: transparent;
    border: none;
    color: var(--gris);
    font-family: 'Source Serif 4', serif;
    font-size: 13px;
    font-weight: 300;
    padding: 10px 0;
    cursor: pointer;
    transition: color 0.2s;
    margin-top: 16px;
    display: block;
  }

  .btn-retour-menu:hover { color: var(--noir); }

  /* BARRE PROGRESSION */
  .progression { height: 3px; background: var(--gris-clair); }
  .progression-barre { height: 100%; background: var(--rouge); transition: width 0.4s ease; }

  /* ENCARTS DÉPLIABLES */
  .encart-toggle {
    background: var(--blanc);
    border: 1px solid var(--gris-clair);
    border-left: 3px solid var(--bleu);
    padding: 14px 18px;
    cursor: pointer;
    font-family: 'Source Serif 4', serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--noir);
    text-align: left;
    width: 100%;
    margin-bottom: 4px;
    transition: background 0.2s;
  }

  .encart-toggle:hover { background: var(--bleu-pale); }
  .encart-toggle-rouge { border-left-color: var(--rouge); }

  .encart-contenu {
    padding: 20px 24px;
    border: 1px solid var(--gris-clair);
    border-top: none;
    margin-bottom: 8px;
    font-size: 14px;
    line-height: 1.8;
    color: var(--gris-fonce);
    font-weight: 300;
  }

  /* SECTION THÉORIE */
  .section-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--rouge);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rouge);
    display: block;
  }

  .section-label-bleu { color: var(--bleu-sombre); border-bottom-color: var(--bleu); }

  /* OUTILS */
  .outil-etape {
    border-left: 3px solid var(--rouge);
    padding: 16px 20px;
    margin-bottom: 12px;
    background: var(--blanc);
  }

  .outil-etape-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;

cole prévu pour ça.*"],question:"Qu'est-ce que tu fais ?",choix:[{label:"Tu absorbes. Tu rappelles les bénéficiaires de Léa pour les caser dans ton agenda déjà plein.",vers:"s2a"},{label:"Tu signales à ton chef que le service ne peut pas absorber l'absence sans renforts.",vers:"s2b"},{label:"Tu en parles à Karin, l'autre collègue. Pour voir comment elle gère, elle.",vers:"s2c"}]},s2a:{sousTitre:"Première semaine",reaction:`C'est un réflexe. Quelqu'un est absent, quelqu'un d'autre compense.

La première semaine, tu tiens. La deuxième, tu manges à ton bureau. La troisième, tu n'arrives plus à dormir.

*Tu dis à tout le monde que ça va.*`,choix:[{label:"Trois semaines plus tard →",vers:"s3"}]},s2b:{sousTitre:"Le chef acquiesce",reaction:`Il dit qu'il va « voir ce qu'il peut faire ». Il ne rappelle pas.

*« Voir ce qu'il peut faire » — tu connais cette formule. Elle signifie que le problème redescend vers toi.*

La première semaine, tu tiens. La deuxième, tu manges à ton bureau. La troisième, tu n'arrives plus à dormir.`,choix:[{label:"Trois semaines plus tard →",vers:"s3"}]},s2c:{sousTitre:"Karin a décidé autrement",reaction:`Karin a décidé de ne pas compenser. Elle garde son agenda tel quel et renvoie les urgences de Léa vers la hiérarchie.

*« C'est pas notre problème à régler »*, dit-elle. *« C'est celui de l'institution. »*

Tu la regardes. Tu ne sais pas si elle a raison ou tort. Tu sais juste que toi, tu n'arrives pas à faire ça.

*Tu absorbes quand même.*`,choix:[{label:"Trois semaines plus tard →",vers:"s3"}]},s3:{contexte:"Trois semaines plus tard",sousTitre:"Le bureau du chef",texte:["Tu es dans le bureau de ton chef. Tu n'as pas demandé ce rendez-vous — c'est lui qui t'a convoquée.","Tu lui dis que tu n'arrives plus à gérer la charge. Que l'absence de Léa n'a pas été remplacée.","Il t'écoute. Puis il te dit que le problème, ce n'est pas la charge de travail.","*C'est ta manière de communiquer. Ton attitude. Le fait que tu « prends les choses trop à cœur ».*"],question:"Qu'est-ce qui se passe en toi dans ce bureau ?",choix:[{label:"Tu t'excuses. Tu promets de faire mieux.",vers:"s4a"},{label:"Tu restes silencieuse. Tu n'as plus les mots.",vers:"s4b"},{label:"Tu insistes. Tu essaies de ramener la conversation sur la charge de travail.",vers:"s4c"}]},s4a:{reaction:`C'est automatique. Presque physique.

Tu sors du bureau avec la conviction diffuse que c'est ta faute. Que tu aurais dû mieux communiquer. Être plus—

*Stop.*

Tu as travaillé soixante heures par semaine pendant trois semaines. Et tu sors d'un bureau en te demandant comment tu aurais pu mieux dire les choses.

Il y a quelque chose qui cloche dans cette phrase.`,choix:[{label:"Quelques semaines plus tard →",vers:"s5"}]},s4b:{reaction:`Ce n'est pas de la lâcheté. C'est de l'épuisement.

Quand on est à bout, les mots ne viennent plus. On sort du bureau avec un poids supplémentaire — et sans comprendre d'où il vient exactement.

*La réalité que tu vis n'était pas le sujet dans ce bureau.*`,choix:[{label:"Quelques semaines plus tard →",vers:"s5"}]},s4c:{reaction:`*« Mais le problème c'est qu'on est deux pour faire le travail de trois — »*

Ton chef soupire. *« Sophie, on n'est pas là pour parler de ça. »*

On n'est pas là pour parler de ça.

*Tu viens de comprendre quelque chose : dans ce bureau, la réalité que tu vis n'est pas le sujet.*`,choix:[{label:"Quelques semaines plus tard →",vers:"s5"}]},s5:{contexte:"Quelques semaines plus tard",sousTitre:"Le retournement",texte:["Tu es en arrêt maladie. Le médecin a dit burn-out. Toi tu n'arrives pas encore à dire ce mot.","Tu apprends par une collègue ce qui se passe dans le service depuis ton départ.","La hiérarchie a convoqué **Karin**. On lui reproche son manque de solidarité. Le fait qu'elle n'ait pas compensé l'absence de Léa.","*C'est la première fois qu'on lui dit quelque chose.*","Pendant trois semaines, personne ne lui avait rien reproché. Pendant trois semaines, c'est toi qui compensais. Et maintenant que tu es en arrêt, c'est Karin qui est responsable de ce que l'institution n'a pas su gérer."],question:"Qu'est-ce que tu ressens en apprenant ça ?",choix:[{label:"De la colère — pour Karin.",vers:"s6a"},{label:"Un soulagement étrange — enfin un mot pour ce que tu as vécu.",vers:"s6b"},{label:"L'envie de lui écrire.",vers:"s6c"}]},s6a:{reaction:`Elle a fait un choix que tu n'as pas pu faire. Se protéger. Ne pas compenser ce que l'institution devait gérer.

Et maintenant on lui fait payer ce choix — alors qu'il était juste.

*L'institution a trouvé quelqu'un à blâmer. Elle en trouve toujours un.*`,choix:[{label:"Suite →",vers:"complS"}]},s6b:{reaction:`Pendant des semaines tu t'es demandé ce que tu avais mal fait.

Maintenant tu vois le mécanisme entier : quand quelqu'un compense, l'institution se tait. Quand quelqu'un se protège, l'institution condamne.

*Dans les deux cas, elle ne se remet jamais en question.*`,choix:[{label:"Suite →",vers:"complS"}]},s6c:{reaction:`Pas pour analyser. Juste pour lui dire : je sais ce que tu traverses. Ce qu'on te reproche, c'est d'avoir refusé de te sacrifier à ma place.

*Tu n'as pas encore la force de beaucoup de choses. Mais ça, tu peux le faire.*`,choix:[{label:"Suite →",vers:"complS"}]},complS:{completion:!0,phrase:`Sophie est en arrêt. Le mot burn-out lui fait encore peur.

Mais elle vient de voir le mécanisme entier.
Et ce qu'on voit, on peut commencer à le nommer.`,versRessources:"fin-s"},"fin-s":{ressources:!0,texteNommer:`Sophie n'a pas fait d'erreur professionnelle. Elle a fait ce que son éthique lui dictait.

Karin n'a pas failli à sa solidarité. Elle a refusé de compenser ce que l'institution devait gérer.

L'institution, elle, n'a jamais été convoquée dans aucun bureau.`,faitReel:"Vincent de Gaulejac appelle ça la violence institutionnelle — pas la violence des intentions, mais celle d'une organisation qui transfère sur les individus la responsabilité de ses propres dysfonctionnements. Et qui change de coupable selon les besoins.",question:"Y a-t-il une situation que tu portes seul·e — et qui devrait être portée par l'institution ? Est-ce qu'il y a quelqu'un à qui tu pourrais le dire, avant que ça coûte quelque chose ?",versN2:"sv2-1"},"sv2-1":{niveau:2,contexte:"Trois semaines plus tard — Appartement de Sophie",sousTitre:"L'idée qui germe",texte:["Tu es en arrêt depuis trois semaines. Tu dors mieux. Pas bien — mieux.","Tu envoies un message au groupe de l'équipe. Pas à la hiérarchie — à l'équipe.","*« Est-ce que vous seriez partant·es pour qu'on se retrouve, informellement, pour parler du travail tel qu'il est vraiment ? Pas une réunion officielle. Juste nous. »*","Trois réponses arrivent en moins d'une heure. Vous vous retrouvez chez toi un mercredi soir. Cinq personnes autour de ta table."],question:"Comment tu commences ?",choix:[{label:"Tu proposes que chacun·e réponde à une seule question : « Qu'est-ce qui t'empêche de faire ton travail correctement en ce moment ? »",vers:"sv2-2a"},{label:"Tu racontes ce que tu as vécu. Tu commences par toi.",vers:"sv2-2b"},{label:"Tu laisses la parole circuler librement. Sans structure.",vers:"sv2-2c"}]},"sv2-2a":{niveau:2,sousTitre:"Ce qui empêche de bien faire",reaction:`La question est simple. Et précisément parce qu'elle est simple, elle déplace quelque chose.

Karin répond en premier. *« Le fait qu'on n'ait pas le temps de finir quoi que ce soit avant que quelque chose d'urgent arrive. »*

Silence. Puis les autres parlent. Les mêmes mots reviennent : urgences, agenda impossible, pas de remplacement.

*Ce n'est pas une liste de plaintes. C'est un diagnostic.*`,choix:[{label:"La question suivante →",vers:"sv2-3"}]},"sv2-2b":{niveau:2,sousTitre:"Commencer par être honnête",reaction:`Tu parles pendant dix minutes. Tu dis tout — l'agenda de trente minutes, l'absence de Léa, la convocation, l'arrêt.

Quand tu termines, Karin dit :

*« Moi j'ai vécu presque la même chose il y a deux ans. Je n'en avais jamais parlé. »*

Et ça commence. Parce que tu as montré que c'était possible de dire les choses vraiment.

*Clot appelle ça le réel de l'activité — ce qu'on vit vraiment, pas ce qu'on est censé vivre.*`,choix:[{label:"La question suivante →",vers:"sv2-3"}]},"sv2-2c":{niveau:2,sousTitre:"La conversation part dans tous les sens",reaction:`Les premières minutes sont difficiles — tout le monde parle en même temps, puis personne ne parle.

Quelqu'un finit par dire : *« On devrait peut-être se donner une question à laquelle répondre chacun·e. »*

Tu proposes : *« Qu'est-ce qui t'empêche de faire ton travail correctement en ce moment ? »*

Et là, ça se met en place.`,choix:[{label:"La question suivante →",vers:"sv2-3"}]},"sv2-3":{niveau:2,contexte:"Une heure plus tard",sousTitre:"Nommer, c'est déjà quelque chose",texte:["Vous avez parlé pendant une heure. Les mêmes problèmes sont apparus dans presque tous les témoignages.","Quelqu'un dit : *« On devrait écrire ça. Pas pour se plaindre — pour avoir quelque chose de concret à montrer. »*","Quelqu'un d'autre : *« À qui ? La hiérarchie va dire que c'est nos problèmes individuels. »*","Silence."],question:"Qu'est-ce que tu proposes ?",choix:[{label:"« On écrit un document ensemble — ce qu'on a dit ce soir. Pas pour la hiérarchie. Pour nous. »",vers:"sv2-4a"},{label:"« On contacte le syndicat. Pas pour faire une grève — pour savoir ce qu'on peut faire. »",vers:"sv2-4b"},{label:"« On se revoit dans deux semaines. Et cette fois on invite les collègues qui n'étaient pas là. »",vers:"sv2-4c"}]},"sv2-4a":{niveau:2,reaction:`Quelqu'un sort son téléphone et commence à noter. Les autres corrigent, précisent, ajoutent.

À la fin de la soirée, vous avez deux pages. Pas un rapport — une mémoire collective.

*Ce document n'ira peut-être nulle part dans l'immédiat. Mais il existe. Et maintenant vous savez que vous n'êtes pas seul·es à penser ce que vous pensez.*`,choix:[{label:"Fin du scénario →",vers:"sv2-fin"}]},"sv2-4b":{niveau:2,reaction:`Deux personnes hésitent. *« Je sais pas si je veux que ça devienne syndical tout de suite. »*

Tu réponds : *« C'est pas 'devenir syndical'. C'est juste savoir ce qu'on peut faire avec ce qu'on a. »*

Karin dit qu'elle connaît quelqu'un au syndicat. Elle envoie un message ce soir-là.

*Ce n'est pas une décision héroïque. C'est un message envoyé un mercredi soir depuis un appartement.*`,choix:[{label:"Fin du scénario →",vers:"sv2-fin"}]},"sv2-4c":{niveau:2,reaction:`Vous finissez par dresser une liste de sept noms. Des gens qui n'avaient pas été invités parce que vous n'étiez pas sûr·es.

Maintenant vous l'êtes un peu plus.

*McAlevey appelle ça cartographier son lieu de travail — savoir qui est là, qui souffre en silence, qui pourrait bouger si on lui proposait quelque chose de concret.*`,choix:[{label:"Fin du scénario →",vers:"sv2-fin"}]},"sv2-fin":{niveau:2,sousTitre:"Ce qui a changé ce soir",finN2:!0,texteNommer:`Sophie n'a pas résolu la surcharge du service. Elle a fait quelque chose de plus petit et de plus difficile : elle a créé un espace où les gens ont pu dire la vérité sur leur travail, ensemble, sans que personne ne les juge.

*C'est souvent là que ça commence.*`,faitReel:"Coutrot et ses collègues ont documenté vingt ans d'enquêtes syndicales sur le travail réel. Leur conclusion : quand les travailleur·euses peuvent nommer collectivement ce qu'ils vivent vraiment, ils retrouvent de la fierté, sortent de la résignation — et commencent à construire des revendications pour lesquelles ils sont prêts à se mobiliser.",question:"Y a-t-il deux ou trois collègues à qui tu pourrais envoyer un message ce soir pour proposer de vous retrouver — juste pour parler du travail tel qu'il est vraiment ?",phrasePoint:"Se retrouver pour dire la vérité sur son travail, ensemble — le chercheur Coutrot a documenté ça comme le point de départ de toute revendication qui mobilise vraiment."}},Bp={s1:5,s2a:18,s2b:18,s2c:18,s3:40,s4a:55,s4b:55,s4c:55,s5:68,s6a:82,s6b:82,s6c:82,complS:88,"fin-s":92,"sv2-1":5,"sv2-2a":25,"sv2-2b":25,"sv2-2c":25,"sv2-3":55,"sv2-4a":75,"sv2-4b":75,"sv2-4c":75,"sv2-fin":100},Vp={s1:1,s2a:1,s2b:1,s2c:1,s3:1,s4a:1,s4b:1,s4c:1,s5:1,s6a:1,s6b:1,s6c:1,complS:1,"fin-s":1,"sv2-1":2,"sv2-2a":2,"sv2-2b":2,"sv2-2c":2,"sv2-3":2,"sv2-4a":2,"sv2-4b":2,"sv2-4c":2,"sv2-fin":2},$p={m1:{contexte:"Lundi matin — Unité de soins spécialisés en addictologie, hôpital public genevois",sousTitre:"Le planning",texte:["Tu t'appelles **Marco**. Infirmier dans une unité spécialisée depuis plusieurs années. Ton service suit des personnes dépendantes — certaines viennent régulièrement depuis des mois. Elles te connaissent. Tu les connais.","Ce matin, un nouveau planning apparaît. À partir du mois prochain : **un infirmier en moins par journée**.","Personne n'a rien expliqué. Aucune séance d'information. Aucune consultation de l'équipe."],question:"Qu'est-ce que tu fais ?",choix:[{label:"Tu attends de voir. Peut-être que c'est provisoire.",vers:"m2a"},{label:"Tu en parles à un·e collègue. Juste pour savoir si tu as bien lu.",vers:"m2b"},{label:"Tu demandes immédiatement à voir ta responsable.",vers:"m2c"}]},m2a:{reaction:`Une semaine passe. Deux. Le planning ne change pas.

Entre-temps, tu as géré seul une situation qui aurait nécessité deux personnes. Ça s'est bien passé.

*« Cette fois » est devenu une unité de mesure dans ce service.*`,choix:[{label:"Quelques jours plus tard →",vers:"m3"}]},m2b:{reaction:`Elle a vu le planning aussi. Elle n'a rien dit parce qu'elle pensait que tu étais au courant.

*« C'est une décision de la direction ? »*

*« Je sais pas. Personne nous a rien expliqué. »*

Ce n'est pas la première fois qu'une décision arrive sans explication. Mais c'est la première fois que ça touche directement la sécurité des patient·es.`,choix:[{label:"Quelques jours plus tard →",vers:"m3"}]},m2c:{reaction:`Elle dit que c'est « une décision budgétaire temporaire » et que « l'équipe devra s'adapter ». Avec le ton de quelqu'un qui sait que c'est insuffisant.

*S'adapter comment, exactement, quand un patient en crise ne peut pas attendre ?*`,choix:[{label:"Quelques jours plus tard →",vers:"m3"}]},m3:{contexte:"La salle de pause",sousTitre:"Toute l'équipe, ensemble",texte:["Quelqu'un propose d'en parler en équipe. Pas une réunion formelle — juste prendre le temps, ensemble.","Vous êtes là, toute l'équipe. C'est rare d'être tous ensemble comme ça, en dehors des transmissions.","Quelqu'un pose la question à voix haute : *« Vous savez ce que ça veut dire concrètement, un infirmier en moins ici ? »*"],question:"Ce qui se passe dans cette pièce :",choix:[{label:"La conversation tourne en rond. Chacun dit ce qu'il pense, mais ça ne mène nulle part.",vers:"m4a"},{label:"L'équipe nomme ce que tout le monde sait : seul·es face à des situations qu'on ne devrait pas gérer seul·es.",vers:"m4b"}]},m4a:{reaction:`C'est souvent comme ça. Pas parce que personne ne pense rien — mais parce que se plaindre ensemble n'est pas la même chose qu'agir ensemble.

Mais quelque chose a changé. Le problème a été dit à voix haute, collectivement.

Le lendemain, quelqu'un propose d'écrire un signalement formel sur ce que ça implique pour la sécurité des patient·es.`,choix:[{label:"Tu proposes que toute l'équipe signe.",vers:"m5a"},{label:"Tu attends de voir si quelqu'un d'autre prend l'initiative.",vers:"m5b"}]},m4b:{reaction:`Silence. Vrai silence — pas le silence du désaccord. Celui de la reconnaissance.

Vous venez de mettre des mots sur quelque chose qui existait sans avoir été dit ensemble.

Quelqu'un propose d'écrire un courrier au service de surveillance — pas pour se plaindre, mais pour signaler ce que ça implique pour la sécurité des patient·es.

*L'équipe entière signe.*`,choix:[{label:"Le courrier est envoyé →",vers:"m6"}]},m5a:{reaction:`Vous l'écrivez ensemble en une demi-heure. Pas de jargon — des faits. Ce que ça veut dire concrètement, un infirmier en moins dans cette unité.

Tous les noms en bas. Pas un nom seul — toute l'équipe.

*Trois noms ensemble, c'est différent d'un nom seul. Huit noms, c'est autre chose encore.*`,choix:[{label:"Quelques jours plus tard →",vers:"m6"}]},m5b:{reaction:`Personne ne prend l'initiative. La semaine passe. Le planning reste.

Deux semaines plus tard, un incident se produit. Rien de grave — mais tout le monde sait que ça aurait pu l'être. Cette fois, quelqu'un propose d'écrire. Et tout le monde signe.`,choix:[{label:"Le courrier est parti →",vers:"m6"}]},m6:{contexte:"Une semaine après l'envoi du courrier",sousTitre:"La convocation",texte:["La responsable convoque toute l'équipe.","Le ton est clair dès le début : vous n'auriez pas dû écrire ce courrier sans passer par la hiérarchie. C'est une question de loyauté. De procédure.","Tu regardes tes collègues autour de la table."],question:"Qu'est-ce que tu ressens dans cette pièce ?",choix:[{label:"De la honte. Peut-être qu'on a mal fait.",vers:"m7a"},{label:"De la colère. On a fait ce qu'il fallait faire.",vers:"m7b"},{label:"Du soulagement. Le courrier a atterri quelque part.",vers:"m7c"}]},m7a:{reaction:`C'est ce que la convocation est censée produire. Et ça fonctionne — pendant quelques minutes.

Puis tu te souviens de ce qui vous a poussé·es à écrire. Un patient en crise. Seul avec lui.

*La honte ne dure pas longtemps quand on se souvient pourquoi on a agi.*`,choix:[{label:"Fin du scénario →",vers:"complM"}]},m7b:{reaction:`L'équipe n'a pas écrit ce courrier pour nuire à l'unité. Elle l'a écrit parce que c'est son métier de garantir la sécurité des patient·es.

La procédure interne n'avait pas fonctionné. Qu'est-ce qu'on était censé·es faire — se taire ?

*Une institution qui convoque une équipe a entendu quelque chose qu'elle aurait préféré ne pas entendre.*`,choix:[{label:"Fin du scénario →",vers:"complM"}]},m7c:{reaction:`Parce que la convocation prouve que le courrier a atterri quelque part. Qu'on n'a pas crié dans le vide.

*Une institution qui convoque est une institution qui a entendu quelque chose qu'elle aurait préféré ignorer.*`,choix:[{label:"Fin du scénario →",vers:"complM"}]},complM:{completion:!0,phrase:`L'équipe a écrit un courrier. Elle a été convoquée.
Elle a tenu.

Ce n'est pas rien.`,versRessources:"fin-m"},"fin-m":{ressources:!0,texteNommer:`Une équipe qui écrit un courrier ensemble n'est pas une équipe qui trahit son institution. C'est une équipe qui prend au sérieux ce que son institution dit vouloir : la sécurité des patient·es.

Être convoqué·es pour ça n'est pas une punition — c'est la preuve que la voix collective dérange davantage que le silence individuel.`,faitReel:"Les décisions budgétaires qui réduisent l'encadrement dans les services de soins spécialisés transfèrent le risque sur les professionnel·les et sur les patient·es. Nommer ce risque collectivement — par écrit, avec tous les noms — c'est refuser que ce transfert reste invisible.",question:"Y a-t-il une décision qui affecte la qualité des soins dont tout le monde parle en couloir — mais que personne n'a encore mise par écrit, collectivement ?",versN2:"mv2-1"},"mv2-1":{niveau:2,contexte:"Le lendemain de la convocation",sousTitre:"Qu'est-ce qu'on fait maintenant ?",texte:["La convocation est passée. L'équipe est sortie de la réunion ensemble — personne n'a rétropédalé.","Mais le planning n'a toujours pas changé. Et la question reste entière : on s'arrête là, ou on continue ?","Dans le couloir, après la fin de service, trois collègues s'attardent.","*« On fait quoi maintenant ? »*"],question:"Qu'est-ce que tu proposes ?",choix:[{label:"« On attend leur réponse au courrier. On leur a donné dix jours. »",vers:"mv2-2a"},{label:"« On documente. Chaque situation difficile depuis le changement de planning, on la note. »",vers:"mv2-2b"},{label:"« On contacte le syndicat. Pas pour faire une grève — pour savoir ce qu'on peut faire. »",vers:"mv2-2c"}]},"mv2-2a":{niveau:2,reaction:`Dix jours passent. Pas de réponse.

Les institutions répondent rarement dans les délais qu'on leur donne. Mais le silence est lui-même une réponse : ils espèrent que vous allez passer à autre chose.

*Est-ce que vous passez à autre chose ?*`,choix:[{label:"Non. On documente ce qui se passe.",vers:"mv2-2b"},{label:"On contacte le syndicat pour savoir quoi faire du silence.",vers:"mv2-2c"}]},"mv2-2b":{niveau:2,reaction:`Vous créez un document partagé. Chaque fois qu'une situation aurait nécessité deux infirmiers et qu'il n'y en avait qu'un, quelqu'un note : date, heure, ce qui s'est passé.

Au bout de trois semaines, vous avez onze entrées.

*Ce n'est plus une opinion. C'est un dossier.*`,choix:[{label:"Fin du scénario →",vers:"mv2-fin"}]},"mv2-2c":{niveau:2,reaction:`Un·e secrétaire syndical·e vient vous rencontrer. Dans la salle de pause, après le service.

Elle vous écoute. Elle pose des questions précises : est-ce que vous avez documenté des incidents ? Quel est le ratio légal minimal ?

*Vous réalisez que vous avez des droits que vous ne connaissiez pas. Et que votre courrier était un premier pas — pas le dernier.*`,choix:[{label:"Fin du scénario →",vers:"mv2-fin"}]},"mv2-fin":{niveau:2,sousTitre:"La voix collective, ça s'entretient",finN2:!0,texteNommer:`Marco et son équipe n'ont pas obtenu de victoire immédiate. Mais ils ont fait quelque chose que beaucoup d'équipes ne font pas : ils ont tenu ensemble après la convocation.

*C'est exactement là que la plupart des mobilisations s'arrêtent — ou continuent.*`,faitReel:"Labor Notes, revue militante américaine de formation syndicale, documente depuis 40 ans une constante : les équipes qui tiennent après la première pression sont celles qui ont pris le temps de décider ensemble de la prochaine étape. Une date. Une action. Un document.",question:"Dans ton équipe, est-ce qu'il y a quelque chose qui mériterait d'être documenté — pas pour se plaindre, mais pour ne plus laisser le risque rester invisible ?",phrasePoint:"Tenir ensemble après la première pression — Labor Notes, revue militante de formation syndicale, le documente depuis 40 ans comme le moment décisif."}},Hp={m1:5,m2a:18,m2b:18,m2c:18,m3:35,m4a:50,m4b:52,m5a:62,m5b:62,m6:72,m7a:85,m7b:85,m7c:85,complM:90,"fin-m":94,"mv2-1":5,"mv2-2a":30,"mv2-2b":65,"mv2-2c":65,"mv2-fin":100},Wp={m1:1,m2a:1,m2b:1,m2c:1,m3:1,m4a:1,m4b:1,m5a:1,m5b:1,m6:1,m7a:1,m7b:1,m7c:1,complM:1,"fin-m":1,"mv2-1":2,"mv2-2a":2,"mv2-2b":2,"mv2-2c":2,"mv2-fin":2},Yp={na1:{contexte:"Mardi matin — École spécialisée, canton de Genève",sousTitre:"Avant que les enfants arrivent",texte:["Tu t'appelles **Nadia**. Éducatrice spécialisée depuis onze ans dans la même institution. Tu as connu l'école avant le changement de loi.","Depuis ce changement, le profil des enfants a évolué — les situations sont plus complexes, les familles traversent des crises plus lourdes. L'encadrement, lui, n'a pas bougé.","Ce matin, tu arrives avec un **dossier d'observation de douze pages** à rendre pour vendredi. Pour l'administration cantonale. Pas pour l'enfant — pour l'administration.","Dans vingt minutes, tu accueilles un groupe de six enfants. Dont un qui a fait une crise violente hier."],question:"Qu'est-ce que tu fais ?",choix:[{label:"Tu commences le dossier. Quinze minutes, tu abats quatre pages.",vers:"na2a"},{label:"Tu laisses le dossier et tu prépares l'accueil du groupe.",vers:"na2b"},{label:"Tu envoies un message à ta collègue Iris : « Comment tu gères, toi ? »",vers:"na2c"}]},na2a:{reaction:`Les enfants arrivent. Tu poses le stylo. Le soir, tu reprends. Comme hier. Comme avant-hier.

*Tu as arrêté de compter les heures supplémentaires il y a longtemps — ça ne changeait rien, alors autant ne pas savoir.*`,choix:[{label:"La pause de l'après-midi →",vers:"na3"}]},na2b:{reaction:`La journée se passe. Intensément — comme d'habitude. L'enfant qui avait fait une crise hier est calme.

Le soir, le dossier est toujours là.

*C'est pour ça que tu es là. Pas pour remplir des cases.*`,choix:[{label:"La pause de l'après-midi →",vers:"na3"}]},na2c:{reaction:`*« Je gère pas »*, répond Iris. *« Je fais semblant. »*

C'est la réponse la plus honnête que tu aies reçue depuis longtemps.`,choix:[{label:"La pause de l'après-midi →",vers:"na3"}]},na3:{contexte:"15h30 — Salle du personnel",sousTitre:"Mehdi part en juin",texte:["Temps de pause. Vous êtes plusieurs dans la salle du personnel. Quelqu'un a apporté des gâteaux.","Iris dit, entre deux bouchées : *« Vous savez que Mehdi part en juin ? »*","Mehdi. Deux ans dans l'équipe. Quelqu'un de bien. Quelqu'un qui connaissait les enfants.","Silence.","*« C'est le troisième depuis janvier »*, dit quelqu'un d'autre."],question:"Qu'est-ce qui se dit dans cette pièce ?",choix:[{label:"Rien de plus. On soupire. On finit les gâteaux. On repart.",vers:"na4a"},{label:"Quelqu'un nomme ce que tout le monde pense.",vers:"na4b"},{label:"Tu dis quelque chose — pas forcément les bons mots, mais quelque chose.",vers:"na4c"}]},na4a:{reaction:`C'est comme ça depuis deux ans. Les gens partent, on forme les nouveaux, on repart.

Mais quelque chose se perd à chaque départ — pas juste une personne, mais tout ce qu'elle savait sur les enfants. Tout ce qui ne s'écrit pas dans un dossier de douze pages.

*Le tournus est devenu le rythme normal de l'institution. Et personne ne le remet en question officiellement.*`,choix:[{label:"Quelques semaines plus tard →",vers:"na5"}]},na4b:{reaction:`*« On forme des gens pour qu'ils partent au bout de deux ans. Parce que personne ne tient plus longtemps dans ces conditions. »*

Silence. Pas le silence du désaccord — celui de la reconnaissance.

*« Et pendant ce temps on nous demande de remplir des grilles d'évaluation qui servent à personne ici. »*

Tu penses aux douze pages sur ton bureau. Tu penses à l'enfant qui avait fait une crise hier. Ces deux choses ne sont pas séparées.`,choix:[{label:"Quelques semaines plus tard →",vers:"na5"}]},na4c:{reaction:`*« Moi je sais plus quoi dire aux nouveaux quand ils arrivent. Je peux pas leur promettre que ça va aller. »*

Iris te regarde. Elle hoche la tête.

*« On leur dit la vérité alors. C'est tout ce qu'on peut faire. »*

Ce n'est pas une solution. Mais c'est un début — nommer honnêtement ce qui se passe.`,choix:[{label:"Quelques semaines plus tard →",vers:"na5"}]},na5:{contexte:"Quelques semaines plus tard",sousTitre:"Se retrouver en dehors",texte:["Après la pause, quelqu'un propose quelque chose d'inhabituel.","Pas une réunion formelle. Pas un courrier à la direction. Juste se retrouver en dehors des heures, sans ordre du jour, pour parler de ce que le métier est devenu.","*« Le syndicat organise ce genre d'espaces »*, dit Iris. *« Pour parler du travail tel qu'il est vraiment. »*"],question:"Qu'est-ce que tu réponds ?",choix:[{label:"« J'ai pas le temps en ce moment. »",vers:"na6a"},{label:"« Je savais pas que ça existait. »",vers:"na6b"},{label:"« Qui d'autre viendrait ? »",vers:"na6c"}]},na6a:{reaction:`C'est vrai. Tu n'as pas le temps.

*C'est aussi exactement pour ça que tu devrais y aller.*

Le manque de temps n'est pas un obstacle à la mobilisation — c'est souvent la raison principale pour laquelle elle est nécessaire.`,choix:[{label:"Fin du scénario →",vers:"complN"}]},na6b:{reaction:"Ça existe. Et ce que vous venez de faire dans cette salle de pause — nommer ensemble ce qui se passe — c'est exactement ce que ces espaces permettent de faire, avec des gens qui ont des outils pour aller plus loin.",choix:[{label:"Fin du scénario →",vers:"complN"}]},na6c:{reaction:`Iris regarde autour de la table.

Trois mains se lèvent. Dont la tienne, sans que tu aies décidé de la lever.`,choix:[{label:"Fin du scénario →",vers:"complN"}]},complN:{completion:!0,phrase:`Nadia a toujours ses douze pages à rendre vendredi.
Mehdi part quand même en juin.

Mais quelque chose a été dit dans cette salle de pause
qui n'existait pas avant.`,versRessources:"fin-n"},"fin-n":{ressources:!0,texteNommer:`Nadia connaît son métier. Elle sait ce qu'un enfant en difficulté a besoin — du temps, de la continuité, quelqu'un qui le connaît vraiment.

Le tournus n'est pas un problème de personnes. C'est la conséquence prévisible d'un système qui épuise les professionnel·les plus vite qu'il ne les forme.`,faitReel:"Le changement de loi sur l'enseignement spécialisé a modifié le profil des enfants accueillis sans prévoir les ressources correspondantes. Chaque départ emporte deux ans de connaissance des enfants — une connaissance qui ne figure dans aucune grille d'évaluation.",question:"Y a-t-il un·e collègue qui est là depuis longtemps, qui voit ce que tu vois, et à qui tu n'as jamais vraiment dit ce que tu penses du travail tel qu'il est devenu ?",versN2:"nv2-na1"},"nv2-na1":{niveau:2,contexte:"Deux semaines plus tard — Même institution",sousTitre:"Rendre le tournus visible",texte:["Vous vous êtes retrouvé·es. Cinq personnes de l'équipe, un soir après le service.","Quelqu'un a apporté une liste : tous les départs depuis trois ans. Noms, durée dans l'institution, raison officielle.","Onze personnes en trois ans. Dans une équipe de quinze.","*Dit comme ça, ça prend une autre dimension.*"],question:"Qu'est-ce qu'on fait de cette liste ?",choix:[{label:"On la garde pour nous. Pour ne plus oublier ce qu'on sait.",vers:"nv2-na2a"},{label:"On contacte les ancien·nes collègues pour savoir pourquoi ils·elles sont parti·es vraiment.",vers:"nv2-na2b"},{label:"On la présente à la direction — avec une demande de réunion pour en parler.",vers:"nv2-na2c"}]},"nv2-na2a":{niveau:2,reaction:`Ce document devient votre mémoire collective. Chaque nouvelle personne qui arrive dans l'équipe le voit.

Et chaque départ qui s'ajoute n'est plus une surprise individuelle — c'est un fait parmi d'autres faits.

*Rendre visible ce qui est invisible, c'est le premier acte politique d'une équipe qui décide de ne plus se taire.*`,choix:[{label:"Fin du scénario →",vers:"nv2-na-fin"}]},"nv2-na2b":{niveau:2,reaction:`Vous envoyez des messages à sept ancien·nes collègues. Cinq répondent.

Les raisons officielles étaient : « opportunité professionnelle », « raisons personnelles ».

Les raisons réelles : épuisement, sentiment d'inutilité face aux enfants qu'on ne peut pas vraiment aider, dossiers administratifs qui prennent le dessus sur le soin.

*C'est la même chose. Dit cinq fois.*`,choix:[{label:"Fin du scénario →",vers:"nv2-na-fin"}]},"nv2-na2c":{niveau:2,reaction:`La direction accepte la réunion. Elle arrive avec des chiffres sur le budget et une présentation sur les « défis du secteur ».

Vous arrivez avec votre liste et cinq témoignages d'ancien·nes collègues.

La réunion ne règle rien. Mais quelque chose a changé : vous n'êtes plus des individus qui se plaignent. Vous êtes une équipe qui documente.

*Ce n'est pas la même chose.*`,choix:[{label:"Fin du scénario →",vers:"nv2-na-fin"}]},"nv2-na-fin":{niveau:2,sousTitre:"Une équipe qui documente",finN2:!0,texteNommer:`Nadia et son équipe n'ont pas arrêté le tournus. Elles ont transformé une accumulation de départs individuels en problème collectif documenté.
